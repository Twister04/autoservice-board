<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoService Pro - Управление сервисом</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1e3c72;
            --primary-light: #2a5298;
            --accent: #ff6b6b;
            --accent-light: #ff8787;
            --success: #51cf66;
            --warning: #ffd93d;
            --danger: #ff6b6b;
            --bg-dark: #0f1419;
            --bg-light: #f8f9fa;
            --text-dark: #2c3e50;
            --text-light: #ecf0f1;
            --border: #e0e6ed;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: var(--text-dark);
            min-height: 100vh;
        }

        /* === АВТОРИЗАЦИЯ === */
        .auth-container {
            display: none;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container.active {
            display: flex;
        }

        .auth-box {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 50px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .auth-header h1 {
            font-size: 2.5em;
            color: var(--primary);
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-header p {
            color: #95a5a6;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(30, 60, 114, 0.1);
        }

        .auth-buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            flex: 2;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 60, 114, 0.3);
        }

        .btn-secondary {
            background: var(--bg-light);
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: white;
        }

        .toggle-mode {
            text-align: center;
            margin-top: 20px;
            color: #95a5a6;
            font-size: 0.9em;
        }

        .toggle-mode a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .toggle-mode a:hover {
            text-decoration: underline;
        }

        .error-message {
            display: none;
            background: #ffe5e5;
            color: var(--danger);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--danger);
            font-size: 0.9em;
        }

        .error-message.show {
            display: block;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* === ОСНОВНОЕ ПРИЛОЖЕНИЕ === */
        .app-container {
            display: none;
            min-height: 100vh;
            background: var(--bg-light);
        }

        .app-container.active {
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary);
        }

        .navbar h2 {
            color: var(--primary);
            font-size: 1.8em;
            letter-spacing: -0.5px;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2em;
        }

        .user-details span {
            display: block;
            font-size: 0.9em;
        }

        .user-details .username {
            font-weight: 600;
            color: var(--text-dark);
        }

        .user-details .role {
            color: #95a5a6;
            font-size: 0.85em;
        }

        .logout-btn {
            padding: 10px 25px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #e63946;
            transform: translateY(-2px);
        }

        .main-content {
            flex: 1;
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card h3 {
            color: var(--primary);
            margin-bottom: 25px;
            font-size: 1.5em;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            margin-bottom: 15px;
            font-family: inherit;
            font-size: 0.95em;
            transition: all 0.3s ease;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(30, 60, 114, 0.1);
        }

        .jobs-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 600px;
            overflow-y: auto;
        }

        .job-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border-left: 5px solid var(--primary);
            padding: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
        }

        .job-item:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border-left-color: var(--accent);
        }

        .job-item h4 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .job-item p {
            color: #666;
            font-size: 0.9em;
            margin: 4px 0;
        }

        .job-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            margin-top: 8px;
        }

        .status-new {
            background: #e3f2fd;
            color: #1565c0;
        }

        .status-working {
            background: #fff3e0;
            color: #e65100;
        }

        .status-completed {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .job-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }

        .job-actions button {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-edit {
            background: var(--primary);
            color: white;
        }

        .btn-edit:hover {
            background: var(--primary-light);
        }

        .btn-delete {
            background: var(--danger);
            color: white;
        }

        .btn-delete:hover {
            background: #e63946;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #37b24d;
        }

        .btn-add {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 60, 114, 0.3);
        }

        .success-message {
            display: none;
            background: #e8f5e9;
            color: var(--success);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid var(--success);
        }

        .success-message.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Адаптивный дизайн */
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .navbar {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .navbar-right {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .auth-box {
                padding: 30px;
            }

            .navbar {
                padding: 15px 20px;
            }

            .main-content {
                padding: 20px;
            }

            .card {
                padding: 20px;
            }
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--primary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div class="auth-container active" id="authContainer">
        <div class="auth-box">
            <div class="auth-header">
                <h1>🔧 AutoService</h1>
                <p>Управление сервисом</p>
            </div>

            <div class="error-message" id="authError"></div>

            <!-- Форма входа -->
            <div id="loginForm">
                <div class="form-group">
                    <label>Имя пользователя</label>
                    <input type="text" id="loginUsername" placeholder="Введите имя" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPassword" placeholder="Введите пароль" autocomplete="current-password">
                </div>
                <div class="auth-buttons">
                    <button class="btn btn-secondary" onclick="toggleForm()">Новый аккаунт</button>
                    <button class="btn btn-primary" onclick="login()">Вход</button>
                </div>
            </div>

            <!-- Форма регистрации -->
            <div id="registerForm" style="display: none;">
                <div class="form-group">
                    <label>Имя пользователя</label>
                    <input type="text" id="regUsername" placeholder="Выберите имя">
                </div>
                <div class="form-group">
                    <label>Полное имя</label>
                    <input type="text" id="regFullname" placeholder="Ваше имя">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="regPassword" placeholder="Минимум 6 символов">
                </div>
                <div class="auth-buttons">
                    <button class="btn btn-secondary" onclick="toggleForm()">Уже есть аккаунт</button>
                    <button class="btn btn-primary" onclick="register()">Зарегистрироваться</button>
                </div>
            </div>

            <div class="toggle-mode">
                <p style="margin-top: 20px; color: #95a5a6;">
                    Демо: admin / admin123
                </p>
            </div>
        </div>
    </div>

    <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
    <div class="app-container" id="appContainer">
        <nav class="navbar">
            <h2>🔧 AutoService Pro</h2>
            <div class="navbar-right">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">A</div>
                    <div class="user-details">
                        <span class="username" id="userName">Пользователь</span>
                        <span class="role" id="userRole">Роль</span>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">Выход</button>
            </div>
        </nav>

        <div class="main-content">
            <!-- Левая панель: Добавление заказа -->
            <div class="card">
                <h3>📝 Новый заказ</h3>
                <div class="success-message" id="successMsg"></div>
                
                <form onsubmit="addJob(event)">
                    <div class="form-group">
                        <label>Имя клиента *</label>
                        <input type="text" id="clientName" required>
                    </div>
                    <div class="form-group">
                        <label>Телефон *</label>
                        <input type="tel" id="clientPhone" required>
                    </div>
                    <div class="form-group">
                        <label>Автомобиль *</label>
                        <input type="text" id="carModel" required>
                    </div>
                    <div class="form-group">
                        <label>Описание работ *</label>
                        <textarea id="jobDesc" required></textarea>
                    </div>
                    <button type="submit" class="btn-add">➕ Добавить заказ</button>
                </form>

                <h3 style="margin-top: 35px; margin-bottom: 20px;">📊 Статистика</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div style="background: #f0f7ff; padding: 15px; border-radius: 8px; border-left: 4px solid #1e3c72;">
                        <div style="font-size: 0.9em; color: #666; margin-bottom: 5px;">Всего заказов</div>
                        <div style="font-size: 2em; font-weight: bold; color: #1e3c72;" id="totalJobs">0</div>
                    </div>
                    <div style="background: #fff8f0; padding: 15px; border-radius: 8px; border-left: 4px solid #e65100;">
                        <div style="font-size: 0.9em; color: #666; margin-bottom: 5px;">В работе</div>
                        <div style="font-size: 2em; font-weight: bold; color: #e65100;" id="workingJobs">0</div>
                    </div>
                </div>
            </div>

            <!-- Правая панель: Список заказов -->
            <div class="card">
                <h3>📋 Заказы</h3>
                <div class="jobs-list" id="jobsList">
                    <div style="text-align: center; color: #bbb; padding: 30px;">
                        Загрузка...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin + '/api';
        let currentUser = null;
        let token = null;
        let allJobs = [];

        // Переключение между формами входа и регистрации
        function toggleForm() {
            document.getElementById('loginForm').style.display = 
                document.getElementById('loginForm').style.display === 'none' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = 
                document.getElementById('registerForm').style.display === 'none' ? 'block' : 'none';
            clearError();
        }

        // Вход
        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showError('Заполните все поля');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'Ошибка входа');
                    return;
                }

                token = data.token;
                currentUser = data.user;
                showApp();
                loadJobs();
            } catch (error) {
                showError('Ошибка подключения к серверу');
            }
        }

        // Регистрация
        async function register() {
            const username = document.getElementById('regUsername').value;
            const fullname = document.getElementById('regFullname').value;
            const password = document.getElementById('regPassword').value;

            if (!username || !fullname || !password) {
                showError('Заполните все поля');
                return;
            }

            if (password.length < 6) {
                showError('Пароль должен быть не менее 6 символов');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, fullname, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'Ошибка регистрации');
                    return;
                }

                token = data.token;
                currentUser = data.user;
                showApp();
                loadJobs();
            } catch (error) {
                showError('Ошибка подключения к серверу');
            }
        }

        // Выход
        function logout() {
            token = null;
            currentUser = null;
            allJobs = [];
            document.getElementById('authContainer').classList.add('active');
            document.getElementById('appContainer').classList.remove('active');
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
        }

        // Показать приложение
        function showApp() {
            document.getElementById('authContainer').classList.remove('active');
            document.getElementById('appContainer').classList.add('active');
            updateUserInfo();
        }

        // Обновить информацию пользователя
        function updateUserInfo() {
            document.getElementById('userName').textContent = currentUser.username;
            document.getElementById('userRole').textContent = currentUser.role === 'admin' ? 'Администратор' : 'Механик';
            document.getElementById('userAvatar').textContent = currentUser.username[0].toUpperCase();
        }

        // Добавить заказ
        async function addJob(event) {
            event.preventDefault();

            const client = document.getElementById('clientName').value;
            const phone = document.getElementById('clientPhone').value;
            const car = document.getElementById('carModel').value;
            const description = document.getElementById('jobDesc').value;

            try {
                const response = await fetch(`${API_URL}/jobs`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ client, phone, car, description })
                });

                if (!response.ok) throw new Error('Ошибка добавления');

                // Очистить форму
                document.getElementById('clientName').value = '';
                document.getElementById('clientPhone').value = '';
                document.getElementById('carModel').value = '';
                document.getElementById('jobDesc').value = '';

                showSuccess('Заказ успешно добавлен! ✓');
                loadJobs();
            } catch (error) {
                showError('Ошибка при добавлении заказа');
            }
        }

        // Загрузить заказы
        async function loadJobs() {
            try {
                const response = await fetch(`${API_URL}/jobs`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Ошибка загрузки');

                allJobs = await response.json();
                renderJobs();
                updateStats();
            } catch (error) {
                console.error('Ошибка загрузки заказов:', error);
            }
        }

        // Рендер заказов
        function renderJobs() {
            const list = document.getElementById('jobsList');

            if (allJobs.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: #bbb; padding: 30px;">Нет заказов</div>';
                return;
            }

            list.innerHTML = allJobs.map(job => `
                <div class="job-item">
                    <h4>${job.client}</h4>
                    <p>📞 ${job.phone}</p>
                    <p>🚗 ${job.car}</p>
                    <p>${job.description}</p>
                    <span class="job-status status-${job.status === 'новый' ? 'new' : job.status === 'в работе' ? 'working' : 'completed'}">
                        ${job.status}
                    </span>
                    <div class="job-actions">
                        <button class="btn-edit" onclick="updateJobStatus(${job.id})">✏️ Статус</button>
                        <button class="btn-delete" onclick="deleteJob(${job.id})">🗑️ Удалить</button>
                    </div>
                </div>
            `).join('');
        }

        // Обновить статус заказа
        async function updateJobStatus(id) {
            const job = allJobs.find(j => j.id === id);
            const statuses = ['новый', 'в работе', 'завершен'];
            const currentIndex = statuses.indexOf(job.status);
            const newStatus = statuses[(currentIndex + 1) % statuses.length];

            try {
                const response = await fetch(`${API_URL}/jobs/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (!response.ok) throw new Error('Ошибка обновления');
                loadJobs();
            } catch (error) {
                showError('Ошибка при обновлении статуса');
            }
        }

        // Удалить заказ
        async function deleteJob(id) {
            if (!confirm('Вы уверены?')) return;

            try {
                const response = await fetch(`${API_URL}/jobs/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Ошибка удаления');
                loadJobs();
            } catch (error) {
                showError('Ошибка при удалении заказа');
            }
        }

        // Обновить статистику
        function updateStats() {
            const total = allJobs.length;
            const working = allJobs.filter(j => j.status === 'в работе').length;
            document.getElementById('totalJobs').textContent = total;
            document.getElementById('workingJobs').textContent = working;
        }

        // Уведомления
        function showError(message) {
            const err = document.getElementById('authError');
            err.textContent = message;
            err.classList.add('show');
            setTimeout(() => err.classList.remove('show'), 4000);
        }

        function clearError() {
            document.getElementById('authError').classList.remove('show');
        }

        function showSuccess(message) {
            const msg = document.getElementById('successMsg');
            msg.textContent = message;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        // Вход по Enter
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('loginForm').style.display !== 'none') {
                    login();
                } else {
                    register();
                }
            }
        });
    </script>
</body>
</html>
